(() => {
  const BASE = '/aino';
  const NAV_LABELS = new Map([
    ['/', 'KOORO'], ['/aino/work/', 'WORK'], ['/aino/services/', 'SERVICES'], ['/aino/about/', 'ABOUT'], ['/aino/play/', 'PLAY'], ['/aino/contact/', 'CONTACT']
  ]);
  const toPath = (href) => {
    const url = new URL(href, location.href);
    let path = url.pathname.startsWith(BASE + '/') ? url.pathname.slice(BASE.length) : url.pathname;
    return path.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
  };
  const toLocal = (href) => {
    try {
      const url = new URL(href, location.href);
      if (!['http:', 'https:'].includes(url.protocol)) return null;
      const sameMount = url.pathname.startsWith(BASE + '/');
      const isLegacySource = [location.hostname, ['www','aino','agency'].join('.'), ['aino','agency'].join('.')].includes(url.hostname);
      if (!sameMount && !isLegacySource) return null;
      const path = toPath(href);
      const local = path === '/' ? `${BASE}/` : `${BASE}${path}/`;
      return local + url.search + url.hash;
    } catch (_) { return null; }
  };
  const injectStyle = () => {
    if (document.querySelector('style[data-local-aino-fallbacks]')) return;
    const style = document.createElement('style');
    style.dataset.localAinoFallbacks = 'true';
    style.textContent = `
      html.js #nav, body.ready #nav { opacity: 1 !important; }
      #nav a, #nav button { opacity: 1 !important; filter: none !important; }
      body img, body video { mix-blend-mode: normal !important; }
      body.work .projects, body.work .buttons .btn { opacity: 1 !important; }
      body.work .gridcontainer { display: block !important; }
      body.work .listcontainer { display: none !important; }
      body.work[data-local-view="list"] .gridcontainer { display: none !important; }
      body.work[data-local-view="list"] .listcontainer { display: block !important; }
      body.work .items .item { opacity: 1 !important; filter: none !important; }
      body.work .items .info { opacity: 1 !important; }
      body.work .buttons button.active { opacity: 1 !important; }
      body.work .buttons button:not(.active) { opacity: .46 !important; }
      body.play-hub .play-container { min-height: calc(100dvh - var(--line) * 3); }
      .local-play-fallback { min-height: 76dvh; padding-top: calc(var(--line) * 5); display: flex; flex-direction: column; justify-content: space-between; gap: calc(var(--line) * 3); }
      .local-play-fallback h1 { font-family: abcplus, Helvetica, sans-serif; font-size: clamp(3.6rem, 15vw, 15rem); line-height: .78; letter-spacing: -.07em; text-transform: uppercase; font-variation-settings: 'MONO' 0, 'wght' 760; }
      .local-play-fallback p { max-width: 38rem; text-transform: none; letter-spacing: .01em; font-size: calc(var(--font-size) * 1.3); line-height: calc(var(--line) * 1.35); }
      .local-play-fallback ul { display: grid; gap: 1px; border-top: 1px solid rgba(var(--black-rgb), .16); }
      .local-play-fallback a { display: grid; grid-template-columns: 6ch 1fr auto; gap: var(--char2); padding: calc(var(--line) * .55) 0; border-bottom: 1px solid rgba(var(--black-rgb), .16); text-decoration: none; }
      @media (max-width: 768px) { .local-play-fallback { padding-top: calc(var(--line) * 3); } .local-play-fallback a { grid-template-columns: 1fr; gap: 0; } }
    `;
    document.head.appendChild(style);
  };
  const reveal = () => {
    document.documentElement.classList.add('light');
    document.body.classList.add('ready');
    injectStyle();
    stabilizeNav();
    wireWorkFallback();
    ensurePlayFallback();
    wireMobileFallback();
  };
  const stabilizeNav = () => {
    const nav = document.querySelector('nav');
    if (!nav) return;
    nav.querySelectorAll('a[href]').forEach((a) => {
      const label = NAV_LABELS.get(toPath(a.getAttribute('href') || ''));
      if (label) { a.dataset.localLabel = label; a.textContent = label; }
    });
    const contact = nav.querySelector('.mobile-contact');
    if (contact) contact.textContent = 'Contact';
    const menu = Array.from(nav.querySelectorAll('.mobile button')).find((button) => !button.classList.contains('mobile-contact'));
    if (menu && !document.querySelector('[data-local-aino-mobile-menu]')) menu.textContent = 'Menu';
    nav.classList.remove('hoverchar');
  };
  const wireWorkFallback = () => {
    if (!document.body.classList.contains('work')) return;
    const grid = document.querySelector('.gridcontainer');
    const list = document.querySelector('.listcontainer');
    const buttons = Array.from(document.querySelectorAll('.buttons button'));
    if (!grid || !list || !buttons.length) return;
    const setView = (view) => {
      document.body.dataset.localView = view;
      buttons.forEach((button) => button.classList.toggle('active', button.textContent.trim().toLowerCase().includes(view)));
    };
    buttons.forEach((button) => {
      if (button.dataset.localWorkWired === 'true') return;
      button.dataset.localWorkWired = 'true';
      button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopImmediatePropagation();
        setView(button.textContent.trim().toLowerCase().includes('list') ? 'list' : 'grid');
      }, true);
    });
    if (!document.body.dataset.localView) setView('grid');
  };
  const ensurePlayFallback = () => {
    if (!document.body.classList.contains('play-hub')) return;
    const target = document.querySelector('.play-container') || document.querySelector('main');
    if (!target || target.querySelector('.local-play-fallback')) return;
    const hasVisibleContent = target.textContent.trim().length > 20;
    if (hasVisibleContent) return;
    target.insertAdjacentHTML('beforeend', `
      <div class="local-play-fallback">
        <div>
          <p class="monocaps">KOORO / play</p>
          <h1>PLAY</h1>
        </div>
        <p>Experimental layer from the KOORO source. The original export ships this tab without static content, so this local mount keeps it usable instead of showing an empty page.</p>
        <ul class="monocaps">
          <li><a href="${BASE}/work/"><span>001</span><span>Back to work archive</span><span>→</span></a></li>
          <li><a href="${BASE}/services/"><span>002</span><span>Services structure</span><span>→</span></a></li>
          <li><a href="${BASE}/contact/"><span>003</span><span>Contact surface</span><span>→</span></a></li>
        </ul>
      </div>
    `);
  };
  const buildFallbackMenu = (button) => {
    const existing = document.querySelector('[data-local-aino-mobile-menu]');
    if (existing) { existing.remove(); button.textContent = 'Menu'; document.querySelector('nav')?.classList.remove('open'); return; }
    const nav = document.querySelector('nav');
    if (!nav) return;
    const panel = document.createElement('div');
    panel.dataset.localAinoMobileMenu = 'true';
    panel.style.cssText = 'position:fixed;left:0;right:0;top:52px;z-index:2147483646;background:#f4f1e8;color:#080808;border-bottom:1px solid rgba(0,0,0,.22);padding:22px 18px 24px;display:grid;gap:13px;font:800 18px/1.08 Arial,system-ui,sans-serif;text-transform:uppercase;letter-spacing:-.035em;box-shadow:0 18px 40px rgba(0,0,0,.12)';
    const items = [['KOORO', BASE + '/'], ['WORK', BASE + '/work/'], ['SERVICES', BASE + '/services/'], ['ABOUT', BASE + '/about/'], ['PLAY', BASE + '/play/'], ['CONTACT', BASE + '/contact/']];
    for (const [label, href] of items) {
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      a.style.cssText = 'color:inherit;text-decoration:none;border-top:1px solid rgba(0,0,0,.12);padding-top:10px';
      panel.appendChild(a);
    }
    nav.after(panel);
    nav.classList.add('open');
    button.textContent = 'Close';
  };
  const wireMobileFallback = () => {
    const mobile = document.querySelector('nav .mobile');
    if (!mobile || mobile.dataset.localFallbackWired === 'true') return;
    mobile.dataset.localFallbackWired = 'true';
    const contact = mobile.querySelector('.mobile-contact');
    const menu = Array.from(mobile.querySelectorAll('button')).find((button) => !button.classList.contains('mobile-contact'));
    if (contact) contact.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopImmediatePropagation();
      window.location.href = BASE + '/aino/contact/';
    }, true);
    if (menu) menu.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopImmediatePropagation();
      buildFallbackMenu(menu);
    }, true);
  };

  document.addEventListener('click', (event) => {
    const a = event.target.closest && event.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href') || '';
    if (/^(mailto:|tel:|javascript:|#)/i.test(href)) return;
    const local = toLocal(href);
    if (local) {
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      window.location.href = local;
    }
  }, true);

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(reveal));
  else requestAnimationFrame(reveal);
  setTimeout(reveal, 180);
  setTimeout(reveal, 700);
  setTimeout(stabilizeNav, 1200);
  setTimeout(stabilizeNav, 2200);
})();
</script></body></html>
