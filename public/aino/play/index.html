(() => {

  const NAV_LABELS = new Map([
    ['/', 'KOORO'], ['/aino/work/', 'TRABAJOS'], ['/aino/services/', 'SERVICIOS'], ['/aino/about/', 'NOSOTROS'], ['/aino/play/', 'NOTAS'], ['/aino/contact/', 'CONTACTO']

  const PILOT_NAMES = [
    'Territorio / atlas mínimo',
    'Compañero / refugio de reservas',
    'Mapa local / casa de calma',
    'Señal web / estudio gráfico',
  ];
  const PILOT_IMAGES = [
    '/aino/kooro-assets/kooro-territorio-atlas-minimo.webp',
    '/aino/kooro-assets/kooro-companero-refugio-reservas.webp',
    '/aino/kooro-assets/kooro-mapa-local-casa-calma.webp',
    '/aino/kooro-assets/kooro-senal-web-estudio-grafico.webp',
  ];
  const toPath = (href) => {
    const url = new URL(href, location.href);
    let path = url.pathname.startsWith(BASE + '/') ? url.pathname.slice(BASE.length) : url.pathname;
    return path.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
  };
  const toLocal = (href) => {
    try {
      const url = new URL(href, location.href);
      if (!['http:', 'https:'].includes(url.protocol)) return null;
      const sameMount = url.pathname.startsWith(BASE + '/');
      const isKooro = ['kooro.studio', 'www.kooro.studio', location.hostname].includes(url.hostname);
      if (!sameMount && !isKooro) return null;
      const path = toPath(href);
      const local = path === '/' ? `${BASE}/` : `${BASE}${path}/`;
      return local + url.search + url.hash;
    } catch (_) { return null; }
  };
  const injectStyle = () => {
    if (document.querySelector('style[data-local-aino-fallbacks]')) return;
    const style = document.createElement('style');
    style.dataset.localAinoFallbacks = 'true';
    style.textContent = `
      html.js #nav, body.ready #nav { opacity: 1 !important; }

      body.work .gridcontainer { display: block !important; }

        .local-play-fallback a { grid-template-columns: 1fr; gap: 0; }
      }
    `;
    document.head.appendChild(style);
  };
  const pilotLineFor = (a, fallbackIndex = 0) => {
    const raw = Number(a.dataset.kooroPilotIndex || fallbackIndex || 0);
    const index = Number.isFinite(raw) ? raw : fallbackIndex;
    return {
      index,
      label: PILOT_NAMES[index % PILOT_NAMES.length],
      image: PILOT_IMAGES[index % PILOT_IMAGES.length],
    };
  };
  const rewriteText = (node, label) => {
    if (!node) return;
    const current = (node.textContent || '').trim();
    const prefix = current.match(/^(A?\d{3}\s*)/i)?.[1] || '';
    node.textContent = `${prefix}${prefix.startsWith('A') ? label.toUpperCase() : label}`;
  };
  const applyKooroAssets = () => {
    document.documentElement.classList.add('light');
    document.querySelectorAll('[data-kooro-linea-visual="true"]').forEach((a, i) => {
      const item = pilotLineFor(a, i);
      a.setAttribute('href', `${BASE}/contact/`);
      a.querySelectorAll('h3, .wide, .name').forEach((el) => rewriteText(el, item.label));
      a.querySelectorAll('img').forEach((img) => {
        img.setAttribute('src', item.image);
        img.removeAttribute('srcset');
        img.setAttribute('alt', `${item.label} — KOORO línea visual`);
        img.removeAttribute('children');
      });
      a.querySelectorAll('video').forEach((video) => {
        const img = document.createElement('img');
        img.src = item.image;
        img.alt = `${item.label} — KOORO línea visual`;
        img.loading = 'lazy';
        img.decoding = 'async';
        const cls = video.getAttribute('class');
        if (cls) img.setAttribute('class', cls);
        const width = video.getAttribute('width');
        const height = video.getAttribute('height');
        if (width) img.setAttribute('width', width);
        if (height) img.setAttribute('height', height);
        video.replaceWith(img);
      });
    });
  };
  const stabilizeNav = () => {
    const nav = document.querySelector('nav');
    if (!nav) return;
    nav.querySelectorAll('a[href]').forEach((a) => {
      const label = NAV_LABELS.get(toPath(a.getAttribute('href') || ''));
      if (label) { a.dataset.localNotasel = label; a.textContent = label; }
    });
    const contact = nav.querySelector('.mobile-contact');
    if (contact) contact.textContent = 'Contacto';
    const menu = Array.from(nav.querySelectorAll('.mobile button')).find((button) => !button.classList.contains('mobile-contact'));
    if (menu && !document.querySelector('[data-local-aino-mobile-menu]')) menu.textContent = 'Menú';
    nav.querySelectorAll('button').forEach((button) => { if (button.textContent.trim().toUpperCase() === 'SETTINGS') button.textContent = 'Ajustes'; });
    nav.classList.remove('hoverchar');
  };
  const wireTrabajosFallback = () => {
    if (!document.body.classList.contains('work')) return;
    const grid = document.querySelector('.gridcontainer');
    const list = document.querySelector('.listcontainer');
    const buttons = Array.from(document.querySelectorAll('.buttons button'));
    if (!grid || !list || !buttons.length) return;
    const setView = (view) => {
      document.body.dataset.localView = view;
      buttons.forEach((button) => button.classList.toggle('active', button.textContent.trim().toLowerCase().includes(view)));
    };
    buttons.forEach((button) => {
      if (button.dataset.localTrabajosWired === 'true') return;
      button.dataset.localTrabajosWired = 'true';
      button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopImmediatePropagation();
        setView(button.textContent.trim().toLowerCase().includes('list') ? 'list' : 'grid');
      }, true);
    });
    if (!document.body.dataset.localView) setView('grid');
  };
  const ensurePlayFallback = () => {
    if (!document.body.classList.contains('play-hub')) return;
    const target = document.querySelector('.play-container') || document.querySelector('main');
    if (!target || target.querySelector('.local-play-fallback')) return;
    const hasVisibleContent = target.textContent.trim().length > 20;
    if (hasVisibleContent) return;
    target.insertAdjacentHTML('beforeend', `
      <div class="local-play-fallback">
        <div>
          <p class="monocaps">KOORO / lab</p>
          <h1>NOTAS</h1>
        </div>
        <p>Un espacio breve para decisiones, referencias y líneas que pueden convertirse en sistemas KOORO.</p>
        <ul class="monocaps">
          <li><a href="${BASE}/work/"><span>001</span><span>Volver a líneas piloto</span><span>→</span></a></li>
          <li><a href="${BASE}/services/"><span>002</span><span>Estructura de servicios web</span><span>→</span></a></li>
          <li><a href="${BASE}/contact/"><span>003</span><span>Empezar un proyecto</span><span>→</span></a></li>
        </ul>
      </div>
    `);
  };
  const buildFallbackMenu = (button) => {
    const existing = document.querySelector('[data-local-aino-mobile-menu]');
    if (existing) { existing.remove(); button.textContent = 'Menú'; document.querySelector('nav')?.classList.remove('open'); return; }
    const nav = document.querySelector('nav');
    if (!nav) return;
    const panel = document.createElement('div');
    panel.dataset.localAinoMobileMenu = 'true';
    panel.style.cssText = 'position:fixed;left:0;right:0;top:52px;z-index:2147483646;background:#f4f1e8;color:#080808;border-bottom:1px solid rgba(0,0,0,.22);padding:22px 18px 24px;display:grid;gap:13px;font:800 18px/1.08 Arial,system-ui,sans-serif;text-transform:uppercase;letter-spacing:-.035em;box-shadow:0 18px 40px rgba(0,0,0,.12)';
    const items = [['KOORO', BASE + '/'], ['TRABAJOS', BASE + '/work/'], ['SERVICIOS', BASE + '/services/'], ['NOSOTROS', BASE + '/about/'], ['NOTAS', BASE + '/play/'], ['CONTACTO', BASE + '/contact/']];
    for (const [label, href] of items) {
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      a.style.cssText = 'color:inherit;text-decoration:none;border-top:1px solid rgba(0,0,0,.12);padding-top:10px';
      panel.appendChild(a);
    }
    nav.after(panel);
    nav.classList.add('open');
    button.textContent = 'Cerrar';
  };
  const wireMobileFallback = () => {
    const mobile = document.querySelector('nav .mobile');
    if (!mobile || mobile.dataset.localFallbackWired === 'true') return;
    mobile.dataset.localFallbackWired = 'true';
    const contact = mobile.querySelector('.mobile-contact');
    const menu = Array.from(mobile.querySelectorAll('button')).find((button) => !button.classList.contains('mobile-contact'));
    if (contact) contact.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopImmediatePropagation();
      window.location.href = BASE + '/contact/';
    }, true);
    if (menu) menu.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopImmediatePropagation();
      buildFallbackMenu(menu);
    }, true);
  };
  const awakenFooter = () => {
    const footer = document.querySelector('#footer');
    if (!footer || footer.dataset.kooroFooterAlive === 'true') return;
    footer.dataset.kooroFooterAlive = 'true';
    const logo = footer.querySelector('.image.logo');
    if (!logo) return;
    logo.innerHTML = `<a class="kooro-footer-sigil" href="${BASE}/contact/" aria-label="KOORO Studio — abrir contacto"><span class="word">KOORO Studio</span><span class="face" aria-hidden="true">*  ·  *</span><span class="trail" aria-hidden="true">/\ bosque · calle · pantalla /\</span></a>`;
  };
  const reveal = () => {
    document.documentElement.classList.add('light');
    document.body.classList.add('ready');
    injectStyle();
    stabilizeNav();
    wireTrabajosFallback();
    ensurePlayFallback();
    wireMobileFallback();
    awakenFooter();
    applyKooroAssets();
  };
  document.addEventListener('click', (event) => {
    const a = event.target.closest && event.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href') || '';
    if (/^(mailto:|tel:|javascript:|#)/i.test(href)) return;
    const local = toLocal(href);
    if (local) {
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      window.location.href = local;
    }
  }, true);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(reveal));
  else requestAnimationFrame(reveal);
  setTimeout(reveal, 180);
  setTimeout(reveal, 700);
  setTimeout(stabilizeNav, 1200);
  setTimeout(stabilizeNav, 2200);
  setTimeout(applyKooroAssets, 320);
  setTimeout(applyKooroAssets, 1400);
})();
</script></body></html>
